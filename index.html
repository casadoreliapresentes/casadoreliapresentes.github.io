<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Casa Dorelia</title>
    <meta
        name="description"
        content="Caixas pensadas para momentos especiais | Presentes afetivos e experiências | Palhoça/SC"
    >
    <meta name="robots" content="index, follow">

    <!-- Canonical URL: replace with your actual domain -->
    <link rel="canonical" href="https://www.casadorelia.com.br/">

    <!-- Open Graph -->
    <meta property="og:title" content="Casa Dorelia">
    <meta
        property="og:description"
        content="Caixas pensadas para momentos especiais | Presentes afetivos e experiências | Palhoça/SC"
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.casadorelia.com.br/">

    <style>
        :root {
            color-scheme: light;
            --background: #fdf7ed;
            --text: #4f3e2f;
            --muted: #837968;
            --accent: #e2b6a0;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            padding: 1.5rem;
            text-align: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text);
        }

        main {
            min-height: calc(100vh - 160px);
            display: grid;
            place-items: center;
            padding: 3rem 1.5rem;
        }

        .container {
            width: min(100%, 720px);
            text-align: center;
        }

        .status {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            background: #faeee8;
            color: #e2b6a0;
            font-size: 0.875rem;
            font-weight: 600;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2.25rem, 7vw, 4.5rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .intro {
            max-width: 600px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 1.125rem;
        }

        footer {
            padding: 1.5rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.875rem;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <a class="logo" href="/" aria-label="Casa Dorelia">
            Casa Dorelia
        </a>
    </header>

    <main>
        <section class="container" aria-labelledby="page-title">
            <span class="status">Em Breve</span>

            <h1 id="page-title">
                Em Construção
            </h1>

            <p class="intro">
                Em breve catalogo completo
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Casa Dorelia.</p>
    </footer>

</body>
</html>
